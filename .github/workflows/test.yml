name: Node.js tests

on:
  push:
    paths:
      - "civ-sim/civ-sim/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "civ-sim/civ-sim/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: civ-sim/civ-sim
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run test suite
        run: npm test
